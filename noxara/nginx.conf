# ============================================================
# NOXARA - Nginx Server Block Configuration
# Domain: noxara.page
# PHP: PHP-FPM 8.2
# ============================================================

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name noxara.page www.noxara.page;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /www/wwwroot/noxara.page;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS server block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name noxara.page www.noxara.page;

    root  /www/wwwroot/noxara.page;
    index index.php index.html;

    # --------------------------------------------------------
    # SSL (aaPanel / Let's Encrypt — update paths as needed)
    # --------------------------------------------------------
    # ssl_certificate     /www/server/panel/vhost/cert/noxara.page/fullchain.pem;
    # ssl_certificate_key /www/server/panel/vhost/cert/noxara.page/privkey.pem;
    # ssl_protocols       TLSv1.2 TLSv1.3;
    # ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    # ssl_prefer_server_ciphers off;
    # ssl_session_cache   shared:SSL:10m;
    # ssl_session_timeout 1d;

    # --------------------------------------------------------
    # Charset & Client Settings
    # --------------------------------------------------------
    charset utf-8;
    client_max_body_size 10M;
    client_body_timeout  30s;
    client_header_timeout 30s;

    # --------------------------------------------------------
    # Gzip Compression
    # --------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # --------------------------------------------------------
    # Security Headers
    # --------------------------------------------------------
    add_header X-Frame-Options          "SAMEORIGIN"           always;
    add_header X-XSS-Protection         "1; mode=block"        always;
    add_header X-Content-Type-Options   "nosniff"              always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --------------------------------------------------------
    # Block sensitive directories
    # --------------------------------------------------------
    location ~ ^/(config|logs|backups|database|\.git|\.env)(/|$) {
        deny all;
        return 403;
    }

    # Block .sql files
    location ~* \.sql$ {
        deny all;
        return 403;
    }

    # Block install directory after installation
    # Uncomment after install is complete:
    # location ^~ /install/ {
    #     deny all;
    #     return 403;
    # }

    # Block dot files
    location ~ /\. {
        deny all;
        return 403;
    }

    # --------------------------------------------------------
    # Static Assets — Cache-Control: max
    # --------------------------------------------------------
    location ~* \.(css|js|svg|png|jpg|jpeg|webp|gif|ico|woff2?|ttf|otf|eot)$ {
        expires max;
        add_header Cache-Control "public, immutable";
        add_header Vary Accept-Encoding;
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }

    # manifest.json and service-worker.js — no cache
    location ~* (manifest\.json|service-worker\.js)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # --------------------------------------------------------
    # Main routing — Clean URLs
    # --------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # --------------------------------------------------------
    # PHP-FPM Handler
    # --------------------------------------------------------
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;

        # aaPanel default PHP-FPM socket — adjust PHP version as needed
        fastcgi_pass unix:/tmp/php-cgi-82.sock;
        # Or TCP: fastcgi_pass 127.0.0.1:9000;

        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include        fastcgi_params;

        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout    180s;
        fastcgi_read_timeout    180s;
        fastcgi_buffer_size     128k;
        fastcgi_buffers         4 256k;
        fastcgi_busy_buffers_size 256k;

        # Security
        fastcgi_param PHP_VALUE "upload_max_filesize=10M \n post_max_size=10M";
        fastcgi_hide_header X-Powered-By;
    }

    # --------------------------------------------------------
    # Logs
    # --------------------------------------------------------
    access_log /www/wwwlogs/noxara.page.log;
    error_log  /www/wwwlogs/noxara.page.error.log;
}

